name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight runs for the same ref. The latest push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Detect which areas changed so we can skip irrelevant job legs on PRs.
  # ────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  # ────────────────────────────────────────────────────────────────────
  # Backend: lint, type-check, migrate, test.
  # ────────────────────────────────────────────────────────────────────
  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ollama_chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci_password@localhost:5432/ollama_chat_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ollama_chat_test
      DEBUG: 'true'
      SECRET_KEY: ci-only-not-secret
      OLLAMA_BASE_URL: http://localhost:11434  # never actually contacted; FakeOllama monkeypatches it
      RUN_MIGRATIONS_ON_STARTUP: 'false'  # we run them as an explicit CI step below

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app

      - name: Black --check
        run: black --check app

      - name: mypy
        run: mypy app
        continue-on-error: true  # mypy strictness still being tightened — see PLAN_NEW.md phase 8

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (no pending model drift)
        run: alembic check
        continue-on-error: true  # alembic check is best-effort until phase 8 fully closes the loop

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # ────────────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, test.
  # ────────────────────────────────────────────────────────────────────
  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

  # ────────────────────────────────────────────────────────────────────
  # Docker: build images on every PR; push on `main` is left for later.
  # ────────────────────────────────────────────────────────────────────
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false

      - name: Build frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          build-args: VITE_API_URL=http://localhost:8000
